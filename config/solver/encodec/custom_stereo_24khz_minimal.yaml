# @package __global__

defaults:
  - ../default
  - override /dset: custom_stereo_24khz
  - _self_

# Audio configuration
sample_rate: 24000  # Target sample rate
channels: 2  # Stereo

# Dataset configuration
dataset:
  batch_size: 4  # Reduced batch size for 24GB GPUs
  num_workers: 4
  segment_duration: 1
  return_info: false
  shuffle: true
  sample_on_duration: true
  sample_on_weight: true
  min_segment_ratio: 0.5
  train:
    num_samples: 500000
    shuffle: true
    shuffle_seed: 0
    permutation_on_files: false
  valid:
    num_samples: 10000
  evaluate:
    num_samples: 10000
  generate:
    num_samples: 50
    segment_duration: 10
    return_info: true

# Training configuration
evaluate:
  every: 25
  num_workers: 5
  metrics:
    visqol: false
    sisnr: true

# Distributed training configuration
distributed:
  ddp: true
  world_size: 2  # Number of GPUs
  rank: 0  # Will be set automatically
  dist_url: env://
  dist_backend: nccl

# Logging configuration
logging:
  tensorboard: true
  wandb: false
  log_every: 100
  log_audio_every: 1000
  log_audio_num_samples: 4
  log_audio_max_duration: 10

# Override base model config
model:
  channels: 2  # Stereo
  sample_rate: 24000

# Training configuration
dataset:
  batch_size: 4  # Reduced batch size for 24GB GPUs
  num_workers: 4
  segment_duration: 1

# Distributed training
distributed:
  world_size: 2  # Number of GPUs
  rank: 0
  dist_url: "tcp://localhost:54321"

# Logging configuration
logging:
  log_tensorboard: false
  log_wandb: true
  wandb:
    project: "encodec-birdcon-24khz"
    name: "birdconv-finetune"
    tags: ["stereo", "24khz", "finetune"]
    notes: "Fine-tuning EnCodec on birdconv audio data with stereo support"

# Evaluation configuration
evaluate:
  every: 25
  num_workers: 5
  metrics:
    visqol: false
    sisnr: true 