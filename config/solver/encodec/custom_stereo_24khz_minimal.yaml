# @package __global__

defaults:
  - compression/encodec_base_24khz
  - override /dset: audio/custom_stereo_24khz
  - _self_

# Override base model config
model:
  channels: 2  # Stereo
  sample_rate: 24000

# Training configuration
dataset:
  batch_size: 4  # Reduced batch size for 24GB GPUs
  num_workers: 4
  segment_duration: 1

# Distributed training
distributed:
  world_size: 2  # Number of GPUs
  rank: 0
  dist_url: "tcp://localhost:54321"

# Logging configuration
logging:
  log_tensorboard: false
  log_wandb: true
  wandb:
    project: "encodec-birdcon-24khz"
    name: "birdconv-finetune"
    tags: ["stereo", "24khz", "finetune"]
    notes: "Fine-tuning EnCodec on birdconv audio data with stereo support"

# Evaluation configuration
evaluate:
  every: 25
  num_workers: 5
  metrics:
    visqol: false
    sisnr: true 